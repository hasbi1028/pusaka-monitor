services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    volumes:
      - pusaka-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pusaka-data:
